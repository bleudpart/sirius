<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">ΣIRIUS — VOTRE ASSISTANT PRIVILÉGIÉ</title>
  <desc id="desc">Icône carrée blanche quadrillée de bleu nuit avec le nom ΣIRIUS au centre et la signature bleu nuit dessous.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="48%">
      <stop offset="0" stop-color="#b9d5df" stop-opacity=".3"/>
      <stop offset=".35" stop-color="#d4e3e9" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#07141f" stroke-opacity=".34" stroke-width="1"/>
    </pattern>
    <filter id="frameGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded"><rect x="0" y="0" width="1254" height="1254" rx="112"/></clipPath>
  </defs>
  <style>
    .navy-frame { animation: frame-pulse 4s ease-in-out infinite; }
    @keyframes frame-pulse { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .navy-frame { animation: none; opacity: .8; } }
  </style>

  <g clip-path="url(#rounded)">
    <rect width="1254" height="1254" fill="url(#bg)"/>
    <rect width="1254" height="1254" fill="url(#grid)"/>
    <ellipse cx="627" cy="535" rx="490" ry="330" fill="url(#core)"/>
    <rect class="navy-frame" x="72" y="72" width="1110" height="1110" rx="72" fill="none" stroke="#07141f" stroke-width="4" filter="url(#frameGlow)"/>

    <text x="627" y="548" text-anchor="middle" fill="#07141f" font-family="Cinzel, Georgia, serif" font-size="176" font-weight="700" letter-spacing="22">ΣIRIUS</text>
    <text x="627" y="704" text-anchor="middle" fill="#07141f" font-family="Cinzel, Georgia, serif" font-size="41" font-weight="600" letter-spacing="8">VOTRE ASSISTANT</text>
    <text x="627" y="764" text-anchor="middle" fill="#07141f" font-family="Cinzel, Georgia, serif" font-size="41" font-weight="600" letter-spacing="8">PRIVILÉGIÉ</text>
    <text x="627" y="840" text-anchor="middle" fill="#07141f" font-family="Cinzel, Georgia, serif" font-size="22" font-weight="600" letter-spacing="5" opacity=".82">INTELLIGENCE · ACTION · MÉMOIRE</text>
  </g>
</svg>