apply plugin: 'com.android.application'

def brotherSdk = file('libs/BrotherPrintLibrary.aar')
if (!brotherSdk.isFile()) {
    throw new GradleException('SDK Brother absent : accepter la licence officielle puis executer frontend\\scripts\\setup-brother-sdk.ps1 (SDK 4.13.2). Voir GUIDE-SIRIUS-1.0.67.txt.')
}
def brotherHash = java.security.MessageDigest.getInstance('SHA-256').digest(brotherSdk.bytes).encodeHex().toString()
if (brotherHash != 'def6bccc7415da38b771186d571757c0a44add5358b6dc7a1855fff77bced64e') {
    throw new GradleException('SDK Brother inattendu : utiliser BrotherPrintLibrary.aar officiel 4.13.2 via setup-brother-sdk.ps1.')
}
if (!file('src/main/assets/brother-sdk/EULA.pdf').isFile()) {
    throw new GradleException('Accord Brother absent des assets : relancer frontend\\scripts\\setup-brother-sdk.ps1 -AcceptLicense apres lecture de la licence.')
}

def siriusKeystorePath = System.getenv('SIRIUS_ANDROID_KEYSTORE')

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        def required = ['SIRIUS_ANDROID_KEYSTORE', 'SIRIUS_ANDROID_STORE_PASSWORD',
                        'SIRIUS_ANDROID_KEY_ALIAS', 'SIRIUS_ANDROID_KEY_PASSWORD']
        def missing = required.findAll { !System.getenv(it)?.trim() }
        if (missing) {
            throw new GradleException("Signature Android release absente : ${missing.join(', ')}")
        }
        if (!file(siriusKeystorePath).isFile()) {
            throw new GradleException('Le fichier SIRIUS_ANDROID_KEYSTORE est introuvable.')
        }
    }
}

android {
    namespace = "fr.sirius_assistant.app"
    compileSdk = libs.versions.compileSdk.get().toInteger()
    defaultConfig {
        applicationId "fr.sirius_assistant.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 58
        versionName "1.0.67"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (siriusKeystorePath) {
                storeFile file(siriusKeystorePath)
                storePassword System.getenv('SIRIUS_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('SIRIUS_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('SIRIUS_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (project.hasProperty('siriusDiagnostic')) {
                applicationIdSuffix ".diagnostic"
                versionNameSuffix "-diagnostic"
                resValue "string", "app_name", "SIRIUS Diagnostic"
                resValue "string", "title_activity_main", "SIRIUS Diagnostic"
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (siriusKeystorePath) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation(name: 'BrotherPrintLibrary', ext: 'aar')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.appcompat
    implementation libs.androidx.coordinatorlayout
    implementation libs.androidx.core.splashscreen
    implementation project(':capacitor-android')
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
