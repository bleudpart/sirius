sonar.exclusions=**/.venv/**,**/node_modules/**,**/build/**,**/dist/**,**/backups/**,**/uploads/**,**/media/**,**/generated-videos/**,**/photo3d-jobs/**,**/*.min.js,**/*.map,frontend/src/temp_auth_api.txt
