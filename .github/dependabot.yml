version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:10"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    assignees:
      - "bleudpart"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:10"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    assignees:
      - "bleudpart"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:10"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    assignees:
      - "bleudpart"
    commit-message:
      prefix: "chore(deps)"
