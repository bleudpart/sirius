version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "04:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    assignees:
      - "bleudpart"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/integrations/zapier"
    schedule:
      interval: "daily"
      time: "04:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    assignees:
      - "bleudpart"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/integrations/raycast"
    schedule:
      interval: "daily"
