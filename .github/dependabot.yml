    open-pull-requests-limit: 3
    assignees:
      - "bleudpart"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "04:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    assignees:
      - "bleudpart"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    assignees:
      - "bleudpart"
    commit-message:
      prefix: "chore(deps)"
