name: Windows signed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build-sign:
    runs-on: windows-2022
    environment: windows-signing
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag from master
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content frontend\package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_REF -notmatch '^refs/tags/v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$version") {
            throw 'Select a vX.Y.Z tag matching frontend/package.json, not a branch.'
          }
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'The release commit must belong to origin/master.' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Install backend and desktop build dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-local.txt -r requirements-build.txt -r requirements-voice-identity.txt
      - name: Test signing and release guards
        run: |
          node --test frontend\scripts\build-signed-windows.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Signing hook tests failed.' }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\test_windows_code_signing.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell signing tests failed.' }
          python -m unittest discover -s scripts -p test_windows_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata tests failed.' }
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand
      - name: Test backend
        working-directory: backend
        run: python -m pytest tests/test_auth_api_unit.py tests/test_server_hardening.py tests/test_local_docstore.py -q
      - name: Install bundled Chromium
        run: python -m playwright install chromium
      - name: Build React and PyInstaller backend without signing secrets
        working-directory: frontend
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'React build failed.' }
          npm run backend:build
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed.' }
        env:
          CI: "true"
      - name: Import the signing certificate
        run: .\scripts\windows-code-signing.ps1 -Action Prepare
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      - name: Package and sign payload, uninstaller, NSIS and portable
        working-directory: frontend
        run: node scripts\build-signed-windows.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify every executable and native library after packaging
        run: |
          .\scripts\windows-code-signing.ps1 -Action Verify -TargetPath frontend\dist -ReportPath "$env:RUNNER_TEMP\windows-signatures.json"
          $version = (Get-Content frontend\package.json -Raw | ConvertFrom-Json).version
          python scripts\stage_windows_release.py --source frontend\dist --destination "$env:RUNNER_TEMP\signed-release" --version $version --report "$env:RUNNER_TEMP\windows-signatures.json"
          if ($LASTEXITCODE -ne 0) { throw 'Signed artifacts or updater metadata invalid.' }
      - name: Remove certificate and private key even on failure
        if: always()
        run: .\scripts\windows-code-signing.ps1 -Action Cleanup
      - name: Upload only verified signed release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-signed-${{ github.ref_name }}
          path: ${{ runner.temp }}\signed-release\*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build-sign
    runs-on: windows-2022
    environment: windows-signing
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-signed-${{ github.ref_name }}
          path: frontend\dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install metadata reader
        run: python -m pip install PyYAML==6.0.3
      - name: Verify downloaded signatures and updater hashes again
        env:
          SIRIUS_SIGNING_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          .\scripts\windows-code-signing.ps1 -Action Verify -TargetPath frontend\dist
          $version = (Get-Content frontend\package.json -Raw | ConvertFrom-Json).version
          python scripts\stage_windows_release.py --source frontend\dist --destination "$env:RUNNER_TEMP\publish-release" --version $version --report frontend\dist\windows-signatures.json
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded release is invalid.' }
      - name: Publish the verified assets atomically through a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\publish-release" -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG --verify-tag --draft --generate-notes @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; an existing release is never overwritten.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed; release remains a draft.' }
