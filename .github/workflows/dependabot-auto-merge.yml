name: Dependabot security auto-merge

on:
  workflow_run:
    workflows:
      - SIRIUS audit and release guard
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  security-update:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { processDependabotRun } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/dependabot-auto-merge.cjs`
            );
            await processDependabotRun({ github, core, context });
