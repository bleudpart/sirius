name: Deploy Hetzner

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy-hetzner.yml"

permissions:
  contents: read

concurrency:
  group: deploy-hetzner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-hetzner-secret:
    runs-on: ubuntu-latest
    outputs:
      has_host: ${{ steps.check.outputs.has_host }}
    steps:
      - name: Check Hetzner host secret
        id: check
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          if [ -n "$HETZNER_HOST" ]; then
            echo "has_host=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_host=false" >> "$GITHUB_OUTPUT"
            echo "HETZNER_HOST is empty; deployment job will be skipped."
          fi

  deploy:
    needs: check-hetzner-secret
    if: ${{ needs.check-hetzner-secret.outputs.has_host == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build website for Hetzner
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://api.sirius-assistant.fr
        run: |
          npm ci --legacy-peer-deps
          npm run build
          printf '%s\n' "$GITHUB_SHA" > build/deploy-sha.txt
          tar -czf ../frontend-web.tar.gz -C build .
      - name: Transfer website
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: frontend-web.tar.gz
          target: /tmp/sirius-frontend-${{ github.sha }}
      - name: Deploy on Hetzner VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            sudo /opt/sirius/deploy/hetzner/deploy.sh /tmp/sirius-frontend-${{ github.sha }}/frontend-web.tar.gz "${{ github.sha }}"