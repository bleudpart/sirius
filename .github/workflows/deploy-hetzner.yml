name: Deploy Hetzner

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy-hetzner.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-hetzner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: ./.github/workflows/sirius-audit.yml
    permissions:
      contents: read
      issues: write

  check-hetzner-secret:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Hetzner deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          for name in HETZNER_HOST HETZNER_USER HETZNER_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; deployment cannot proceed."
              exit 1
            fi
          done

  deploy:
    needs: [audit, check-hetzner-secret]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build website for Hetzner
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://api.sirius-assistant.fr
        run: |
          npm ci --legacy-peer-deps
          npm run build
          printf '%s\n' "$GITHUB_SHA" > build/deploy-sha.txt
          tar -czf ../frontend-web.tar.gz -C build .
      - name: Transfer website
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          fingerprint: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
          source: frontend-web.tar.gz
          target: /tmp/sirius-frontend-${{ github.sha }}
      - name: Deploy on Hetzner VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          fingerprint: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
          command_timeout: 20m
          script: |
            set -eu
            sudo /opt/sirius/deploy/hetzner/deploy.sh /tmp/sirius-frontend-${{ github.sha }}/frontend-web.tar.gz "${{ github.sha }}"
            if [ ! -f /etc/systemd/system/sirius.service.d/90-sirius-managed-database.conf ]; then
              echo "Activation de la protection de la base cloud."
              sudo /opt/sirius/deploy/hetzner/deploy.sh "" "${{ github.sha }}"
            fi
            python3 /opt/sirius/deploy/hetzner/monitor.py api-local