name: Deploy Hetzner

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy-hetzner.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-hetzner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: ./.github/workflows/sirius-audit.yml
    permissions:
      contents: read
      issues: write
      pull-requests: read

  check-hetzner-secret:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Hetzner deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST_FINGERPRINT: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
        run: |
          for name in HETZNER_HOST HETZNER_USER HETZNER_SSH_KEY HETZNER_HOST_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; deployment cannot proceed."
              exit 1
            fi
          done

  deploy:
    needs: [audit, check-hetzner-secret]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build website for Hetzner
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://api.sirius-assistant.fr
        run: |
          npm ci --legacy-peer-deps
          npm run build
          printf '%s\n' "$GITHUB_SHA" > build/deploy-sha.txt
          tar -czf ../frontend-web.tar.gz -C build .
      - name: Configure pinned Hetzner SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST_FINGERPRINT: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
        run: bash deploy/hetzner/setup-ssh.sh
      - name: Transfer website
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          target="$HETZNER_USER@$HETZNER_HOST"
          remote_dir="/tmp/sirius-frontend-$GITHUB_SHA"
          ssh_options=(
            -i "$HETZNER_SSH_IDENTITY_FILE"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HETZNER_SSH_KNOWN_HOSTS_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -o ConnectTimeout=15
          )
          bash deploy/hetzner/retry-ssh.sh timeout 2m ssh "${ssh_options[@]}" "$target" "mkdir -p -- '$remote_dir'"
          bash deploy/hetzner/retry-ssh.sh timeout 10m scp "${ssh_options[@]}" frontend-web.tar.gz "$target:$remote_dir/frontend-web.tar.gz"
      - name: Deploy on Hetzner VPS
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          target="$HETZNER_USER@$HETZNER_HOST"
          timeout 20m ssh \
            -i "$HETZNER_SSH_IDENTITY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HETZNER_SSH_KNOWN_HOSTS_FILE" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "$target" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          sha="$1"
          sudo /opt/sirius/deploy/hetzner/deploy.sh "/tmp/sirius-frontend-$sha/frontend-web.tar.gz" "$sha"
          if [ ! -f /etc/systemd/system/sirius.service.d/90-sirius-managed-database.conf ]; then
            echo "Activation de la protection de la base cloud."
            sudo /opt/sirius/deploy/hetzner/deploy.sh "" "$sha"
          fi
          python3 /opt/sirius/deploy/hetzner/monitor.py api-local
          REMOTE
