name: SIRIUS audit and release guard

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches: [master]
    paths-ignore:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy-hetzner.yml"

permissions:
  contents: read

concurrency:
  group: sirius-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Install restic for backup and restore tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic
      - name: Backend syntax and focused tests
        run: |
          python -m py_compile haccp_kitchen.py ../deploy/hetzner/sqlite_snapshot.py ../deploy/hetzner/monitor.py
          python -m pytest tests/test_haccp_kitchen.py tests/test_haccp_entries.py tests/test_backup_recovery.py tests/test_deploy_guard.py tests/test_monitor.py tests/test_database_failover.py tests/test_resilience.py -q
          python -m py_compile server.py sirius_brain.py proactive.py enterprise.py account_deletion.py auth_api.py local_memory.py live_work.py routers/files.py routes/pantheon_oracle.py routes/work_dossiers.py
          python -m py_compile document_scan_pdf.py routes/document_scans.py
          python -m py_compile chronos_store.py chronos_assistant.py routes/chronos.py
          python -m py_compile work_conversation.py work_invoice_batch.py work_draft_recordings.py
          python -m py_compile nummarius_api.py nummarius_market_data.py nummarius_indicators.py
          python -m pytest tests/test_nummarius_analytics.py -q
          python -m py_compile ariane_market_runs.py
          python -m pytest tests/test_ariane_market_runs.py -q
          python -m py_compile finance_workspace.py finance_conversation.py
          python -m py_compile finance_database.py finance_connectors.py ingestion_service.py kpi_engine.py finance_demo.py finance_entries.py simulation_service.py models/finance.py schemas/finance.py schemas/finance_entries.py schemas/finance_ingestion.py schemas/finance_simulation.py routers/finance.py brain_analytical/__init__.py brain_analytical/schemas.py brain_analytical/repartition.py
          python -m py_compile brain_analytical/collecte.py brain_analytical/regles.py brain_analytical/store.py brain_analytical/strategic_advisor.py brain_analytical/orchestrator.py brain_analytical/routes.py brain_analytical/conversation.py routes/proactive_routes.py
          python -m pytest tests/test_finance_workspace.py tests/test_company_finance.py tests/test_finance_banking.py tests/test_finance_entries.py tests/test_finance_ingestion.py tests/test_finance_bank_statements.py tests/test_finance_demo.py tests/test_finance_simulation.py tests/test_brain_analytical.py -q
          python -m py_compile action_registry.py action_runs.py finance_actions.py
          python -m pytest tests/test_action_runs.py -q
          python -m py_compile operational_work.py
          python -m pytest tests/test_operational_work.py -q
          python -m pytest tests/test_work_conversation.py tests/test_work_invoice_batch.py tests/test_work_draft_recordings.py -q
          python -m pytest tests/test_chronos.py tests/test_chronos_assistant.py -q
          python -m pytest tests/test_document_scans.py tests/test_email_signature.py tests/test_themis_accounting.py -q
          python -m pytest tests/test_microphone_selection.py -q
          python -m pytest tests/test_live_work.py tests/test_speech_vocabulary.py -q
          python -m pytest tests/test_news_command_routing.py -q
          python -m py_compile duerp.py safety_documentation.py haccp_sheet_documents.py alexa_integration.py tuya_integration.py
          python -m py_compile haccp_database.py models/haccp.py models/haccp_printing.py schemas/haccp.py schemas/haccp_documents.py services/haccp_vision.py services/haccp_opening.py routers/haccp.py routers/haccp_printing.py routers/haccp_documents.py routers/haccp_entries.py
          python -m pytest tests/test_haccp_labels.py tests/test_haccp_printing.py -q
          python -m pytest tests/test_duerp.py tests/test_safety_documentation.py tests/test_haccp_sheet_documents.py tests/test_alexa_tuya.py tests/test_speech_elisions.py tests/test_version_consistency.py -q
          python -m py_compile models/haccp_reception.py schemas/haccp_reception.py services/haccp_reception.py routers/haccp_reception.py
          python -m py_compile analytics_engine.py schemas/finance_analytics.py routers/finance_analytics.py
          python -m py_compile tri_cortex/__init__.py tri_cortex/agents.py tri_cortex/brain1_agents.py tri_cortex/brains.py tri_cortex/routes.py tri_cortex/runtime.py tri_cortex/schemas.py tri_cortex/services.py tri_cortex/store.py tri_cortex/telemetry.py tri_cortex/vision.py
          python -m py_compile modules_api.py payments_api.py provider_access.py
          python -m pytest tests/test_haccp_reception.py tests/test_finance_analytics.py tests/test_brain1_agents.py tests/test_brain1_api.py tests/test_tri_cortex.py tests/test_tri_cortex_api.py tests/test_tri_cortex_services.py tests/test_mythos_consult.py tests/test_provider_trial.py -q
          python -m pytest tests/test_proactive.py tests/test_briefing_intent.py tests/test_briefing_news.py tests/test_sports_news.py tests/test_gemini_tts.py tests/test_enterprise.py tests/test_sirius_doctor.py tests/test_auth_api_unit.py tests/test_account_inactivity.py tests/test_account_deletion.py tests/test_server_hardening.py tests/test_local_docstore.py tests/test_work_dossiers.py tests/test_brain_response_latency.py tests/test_sirius_targeted_research.py tests/test_sirius_core_prompt.py tests/test_voice_corrections.py tests/test_stt_fallback.py tests/test_sirius_audit_secrets.py -q
        working-directory: backend
      - name: Frontend automated tests
        run: npm test -- --watchAll=false --runInBand
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
        env:
          CI: "true"
      - name: Windows printer bridge tests (simulated)
        run: node --test scripts/haccp-printer.test.cjs scripts/native-automation.test.cjs
        working-directory: frontend
      - name: Frontend development server and proxy tests
        run: node --test scripts/craco-dev-server.test.cjs
        working-directory: frontend
      - name: Monitoring alert tests
        run: node --test deploy/hetzner/monitor-deployment.test.cjs deploy/hetzner/monitor-issues.test.cjs deploy/hetzner/monitor-sms.test.cjs scripts/dependency-audit-alert.test.cjs scripts/dependabot-auto-merge.test.cjs
      - name: Maintenance configuration tests
        run: python -m unittest discover -s scripts -p test_maintenance_config.py
      - name: Windows release metadata and workflow tests
        run: python -m unittest discover -s scripts -p test_windows_release.py
      - name: Website release retention test
        run: bash deploy/hetzner/cleanup-releases.test.sh
      - name: Run SIRIUS audit
        run: python scripts/sirius_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sirius-audit-report
          path: audit-report.json
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Windows package manager selection
        run: python -m unittest discover -s scripts -p test_windows_build_package_manager.py
      - name: Test Windows signing guards without certificates
        run: |
          node --test frontend\scripts\build-signed-windows.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Signing hook tests failed.' }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\test_windows_code_signing.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Signing guard tests failed.' }
      - name: Check real Yarn compatibility
        working-directory: frontend
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"
        run: npx.cmd --yes yarn@1.22.22 config get registry
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Zapier integration
        run: |
          npm ci --ignore-scripts
          npm test
          npm run validate -- --without-style
        working-directory: integrations/zapier
      - name: Type-check Raycast integration
        run: |
          npm ci --ignore-scripts
          npm run typecheck
        working-directory: integrations/raycast
  dependabot_files:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - name: Detect application changes
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            core.setOutput("app", files.some(({ filename }) => /^(frontend|backend)\//.test(filename)));
  electron-build:
    needs: dependabot_files
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      needs.dependabot_files.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Install backend build dependencies
        run: python -m pip install -r requirements.txt -r requirements-local.txt -r requirements-build.txt -r requirements-voice-identity.txt
        working-directory: backend
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
        working-directory: backend
      - name: Build Windows installers
        run: npm run electron:build
        working-directory: frontend
  notify-failure:
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    needs: [audit, windows-build, integration-tests, dependabot_files, electron-build]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `SIRIUS audit failed (${context.sha.slice(0, 7)})`;
            const body = `Automated audit failed on ${new Date().toISOString()}\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'automated-audit'});
            const existing = issues.data.find(issue => issue.title.startsWith('SIRIUS audit failed'));
            if (existing) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['automated-audit']});
