name: SIRIUS audit and release guard

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 4 * * 0"
  push:
    branches: [master]

permissions:
  contents: read
  issues: write

concurrency:
  group: sirius-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Backend syntax and focused tests
        run: |
          python -m py_compile server.py sirius_brain.py proactive.py enterprise.py account_deletion.py auth_api.py local_memory.py live_work.py routers/files.py routes/pantheon_oracle.py routes/work_dossiers.py
          python -m py_compile document_scan_pdf.py routes/document_scans.py
          python -m py_compile chronos_store.py chronos_assistant.py routes/chronos.py
          python -m py_compile work_conversation.py work_invoice_batch.py work_draft_recordings.py
          python -m py_compile nummarius_api.py nummarius_market_data.py nummarius_indicators.py
          python -m pytest tests/test_nummarius_analytics.py -q
          python -m py_compile ariane_market_runs.py
          python -m pytest tests/test_ariane_market_runs.py -q
          python -m py_compile finance_workspace.py finance_conversation.py
          python -m pytest tests/test_finance_workspace.py -q
          python -m py_compile action_registry.py action_runs.py finance_actions.py
          python -m pytest tests/test_action_runs.py -q
          python -m py_compile operational_work.py
          python -m pytest tests/test_operational_work.py -q
          python -m pytest tests/test_work_conversation.py tests/test_work_invoice_batch.py tests/test_work_draft_recordings.py -q
          python -m pytest tests/test_chronos.py tests/test_chronos_assistant.py -q
          python -m pytest tests/test_document_scans.py tests/test_email_signature.py -q
          python -m pytest tests/test_microphone_selection.py -q
          python -m pytest tests/test_live_work.py tests/test_speech_vocabulary.py -q
          python -m pytest tests/test_news_command_routing.py -q
          python -m py_compile duerp.py safety_documentation.py haccp_sheet_documents.py alexa_integration.py tuya_integration.py
          python -m py_compile haccp_database.py models/haccp.py models/haccp_printing.py schemas/haccp.py services/haccp_vision.py services/haccp_opening.py routers/haccp.py routers/haccp_printing.py
          python -m pytest tests/test_haccp_labels.py tests/test_haccp_printing.py -q
          python -m pytest tests/test_duerp.py tests/test_safety_documentation.py tests/test_haccp_sheet_documents.py tests/test_alexa_tuya.py tests/test_speech_elisions.py tests/test_version_consistency.py -q
          python -m pytest tests/test_proactive.py tests/test_briefing_intent.py tests/test_briefing_news.py tests/test_sports_news.py tests/test_gemini_tts.py tests/test_enterprise.py tests/test_sirius_doctor.py tests/test_auth_api_unit.py tests/test_account_inactivity.py tests/test_account_deletion.py tests/test_server_hardening.py tests/test_local_docstore.py tests/test_work_dossiers.py tests/test_brain_response_latency.py tests/test_sirius_targeted_research.py tests/test_sirius_core_prompt.py tests/test_voice_corrections.py tests/test_stt_fallback.py -q
        working-directory: backend
      - name: Frontend automated tests
        run: npm test -- --watchAll=false --runInBand
        working-directory: frontend
      - name: Windows printer bridge tests (simulated)
        run: node --test scripts/haccp-printer.test.cjs scripts/native-automation.test.cjs
        working-directory: frontend
      - name: Run SIRIUS audit
        run: python scripts/sirius_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sirius-audit-report
          path: audit-report.json
      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `SIRIUS audit failed (${context.sha.slice(0, 7)})`;
            const body = `Automated audit failed on ${new Date().toISOString()}\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'automated-audit'});
            const existing = issues.data.find(issue => issue.title.startsWith('SIRIUS audit failed'));
            if (existing) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['automated-audit']});