name: SIRIUS audit and release guard

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 4 * * 0"
  push:
    branches: [master]

permissions:
  contents: read
  issues: write

concurrency:
  group: sirius-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Backend syntax and focused tests
        run: |
          python -m py_compile server.py sirius_brain.py proactive.py enterprise.py routers/files.py routes/pantheon_oracle.py
          python -m pytest tests/test_proactive.py tests/test_briefing_intent.py tests/test_enterprise.py tests/test_sirius_doctor.py tests/test_auth_api_unit.py tests/test_server_hardening.py -q
        working-directory: backend
      - name: Frontend automated tests
        run: npm test -- --watchAll=false --runInBand
        working-directory: frontend
      - name: Run SIRIUS audit
        run: python scripts/sirius_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sirius-audit-report
          path: audit-report.json
      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `SIRIUS audit failed (${context.sha.slice(0, 7)})`;
            const body = `Automated audit failed on ${new Date().toISOString()}\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'automated-audit'});
            const existing = issues.data.find(issue => issue.title.startsWith('SIRIUS audit failed'));
            if (existing) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['automated-audit']});