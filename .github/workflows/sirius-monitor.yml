name: SIRIUS monitoring

on:
  workflow_dispatch:
    inputs:
      test_sms:
        description: "Envoyer un SMS de test (facturé par le prestataire)"
        type: boolean
        required: false
        default: false
  workflow_run:
    workflows: ["Deploy Hetzner"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: sirius-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic-mongodb:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Compare the running MongoDB configuration
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
            set -euo pipefail
            if [ -z "$HETZNER_HOST" ] || [ -z "$HETZNER_USER" ] || [ -z "$HETZNER_SSH_KEY" ]; then
              echo "RESULTAT=CONFIGURATION_SSH_ABSENTE"
              exit 1
            fi
            umask 077
            temporary="$(mktemp -d "$RUNNER_TEMP/sirius-mongo-XXXXXXXX")"
            cleanup() {
              rm -f -- "$temporary/key" "$temporary/scan" "$temporary/known_hosts"
              rmdir -- "$temporary"
            }
            trap cleanup EXIT
            printf '%s\n' "$HETZNER_SSH_KEY" > "$temporary/key"
            unset HETZNER_SSH_KEY
            if ! ssh-keyscan -T 15 -t ed25519 "$HETZNER_HOST" > "$temporary/scan" 2>/dev/null; then
              echo "RESULTAT=LECTURE_CLE_SSH_IMPOSSIBLE"
              exit 1
            fi
            python3 - "$temporary/scan" "$temporary/known_hosts" <<'KEYCHECK'
            import base64
            import binascii
            import hashlib
            import hmac
            import sys
            from pathlib import Path

            expected = "SHA256:zQzsNwKMx3lcLQbl3B9VjYDGmh63g1Lza0YwY6l5n9I"
            verified = []
            for line in Path(sys.argv[1]).read_text().splitlines():
                fields = line.split()
                if len(fields) < 3 or fields[1] != "ssh-ed25519":
                    continue
                try:
                    public_key = base64.b64decode(fields[2], validate=True)
                except (ValueError, binascii.Error):
                    print("RESULTAT=CLE_SSH_INVALIDE")
                    sys.exit(2)
                digest = base64.b64encode(hashlib.sha256(public_key).digest()).decode().rstrip("=")
                if hmac.compare_digest("SHA256:" + digest, expected):
                    verified.append(line)
            if not verified:
                print("RESULTAT=EMPREINTE_SSH_DIFFERENTE")
                sys.exit(2)
            Path(sys.argv[2]).write_text("\n".join(verified) + "\n")
            KEYCHECK
            ssh -i "$temporary/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
              -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$temporary/known_hosts" -o GlobalKnownHostsFile=/dev/null \
              -- "$HETZNER_USER@$HETZNER_HOST" \
              'PYTHONDONTWRITEBYTECODE=1 /opt/sirius/.venv/bin/python -' <<'PY'
            import hashlib
            import os
            import stat
            import subprocess
            import sys
            from pathlib import Path
            from urllib.parse import urlsplit

            from dotenv import load_dotenv

            EXPECTED = "2ea4dd6061b14ae7de31a66e53981a1dc32f00bc57e8772f5e0f826bcf7577f1"
            EXPECTED_HOST = "4d50cd778c40ddd57e50b20b008ec427a27331b2effe932bd5ef2f3f0fb5e8d6"
            ROOT = Path("/opt/sirius/backend").resolve()
            COMMAND_ENV = {"PATH": "/usr/bin:/bin", "LANG": "C.UTF-8"}

            def main_pid():
                result = subprocess.run(
                    ["systemctl", "show", "sirius.service", "--property=MainPID", "--value"],
                    capture_output=True, text=True, check=True, timeout=10, env=COMMAND_ENV,
                )
                pid = result.stdout.strip()
                if not pid.isdecimal() or int(pid) <= 1:
                    raise RuntimeError("service unavailable")
                return pid

            def started_at(pid):
                proc_stat = Path(f"/proc/{pid}/stat").read_text()
                fields = proc_stat.rsplit(") ", 1)[1].split()
                boot = next(
                    int(line.split()[1])
                    for line in Path("/proc/stat").read_text().splitlines()
                    if line.startswith("btime ")
                )
                return boot + int(fields[19]) / os.sysconf("SC_CLK_TCK")

            def load_existing(path, override, started):
                try:
                    info = path.stat()
                except FileNotFoundError:
                    return
                if not stat.S_ISREG(info.st_mode) or info.st_mtime > started:
                    raise RuntimeError("dotenv changed after startup or is not a file")
                load_dotenv(dotenv_path=path, override=override)

            def configuration(initial, root, started):
                os.environ.clear()
                os.environ.update(initial)
                load_existing(root / ".env", False, started)
                configured = os.environ.get("SIRIUS_DATA_DIR", "").strip()
                directory = Path(configured).expanduser().resolve() if configured else root
                if not stat.S_ISDIR(directory.stat().st_mode):
                    raise RuntimeError("data directory unavailable")
                if directory != root:
                    load_existing(directory / ".env", True, started)
                url = urlsplit(os.environ.get("MONGO_URL", "mongodb://localhost:27017"))
                if url.scheme not in ("mongodb", "mongodb+srv") or not url.hostname:
                    raise ValueError("invalid MongoDB address")
                hostname = url.hostname.lower()
                database = os.environ.get("DB_NAME", "sirius_db")
                fingerprint = hashlib.sha256((hostname + "\0" + database).encode()).hexdigest()
                return hostname, fingerprint

            def logged_hosts(pid):
                journal = subprocess.run(
                    ["journalctl", "--no-pager", "--quiet", "--output=cat",
                     "--grep", r"\[DB\] MongoDB détecté", f"_PID={pid}"],
                    capture_output=True, text=True, timeout=10, env=COMMAND_ENV,
                )
                marker = "[DB] MongoDB détecté : "
                records = [line.split(marker, 1)[1].strip()
                           for line in journal.stdout.splitlines() if marker in line]
                if journal.returncode != 0 or not records:
                    return []
                hosts = [urlsplit(value).hostname for value in records]
                if not all(hosts):
                    raise ValueError("unparseable MongoDB host in log")
                return [host.lower() for host in hosts]

            def run():
                pid = main_pid()
                if Path(f"/proc/{pid}/cwd").resolve(strict=True) != ROOT:
                    raise RuntimeError("unexpected backend directory")
                initial = {}
                for entry in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
                    if b"=" in entry:
                        key, value = entry.split(b"=", 1)
                        initial[os.fsdecode(key)] = os.fsdecode(value)
                hostname, fingerprint = configuration(initial, ROOT, started_at(pid))
                if main_pid() != pid:
                    raise RuntimeError("service restarted during check")
                hosts = logged_hosts(pid)
                if not hosts:
                    journal_result = "NON_VERIFIE"
                elif all(host == hostname for host in hosts):
                    journal_result = "HOTE_IDENTIQUE"
                else:
                    raise RuntimeError("running service log does not match configuration")
                if main_pid() != pid:
                    raise RuntimeError("service restarted during check")
                print("RESULTAT=CONFIGURATION_IDENTIQUE" if fingerprint == EXPECTED
                      else "RESULTAT=CONFIGURATION_DIFFERENTE")
                print(f"JOURNAL={journal_result}")

            def journal_fallback():
                pid = main_pid()
                hosts = logged_hosts(pid)
                if main_pid() != pid:
                    raise RuntimeError("service restarted during check")
                if not hosts:
                    print("JOURNAL=NON_VERIFIE")
                elif all(hashlib.sha256(host.encode()).hexdigest() == EXPECTED_HOST for host in hosts):
                    print("JOURNAL=CLUSTER_IDENTIQUE")
                else:
                    print("JOURNAL=CLUSTER_DIFFERENT")

            if __name__ == "__main__":
                try:
                    run()
                except PermissionError:
                    print("RESULTAT=ACCES_REFUSE")
                    try:
                        journal_fallback()
                    except (OSError, ValueError, UnicodeError, LookupError, StopIteration,
                            RuntimeError, subprocess.SubprocessError):
                        print("JOURNAL=NON_VERIFIE")
                    sys.exit(2)
                except (OSError, ValueError, UnicodeError, LookupError, StopIteration,
                        RuntimeError, subprocess.SubprocessError) as error:
                    print(f"RESULTAT=INCONCLUSIF_{type(error).__name__}")
                    sys.exit(2)
            PY
  monitor:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check latest deployment
        id: deployment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { latestDeployment } = require('./deploy/hetzner/monitor-deployment.cjs');
            const outcome = await latestDeployment(github, context);
            core.setOutput('outcome', outcome);
            if (outcome === 'failure') core.setFailed("Le dernier déploiement n'a pas réussi.");
      - name: Check public website
        id: site
        continue-on-error: true
        run: python3 deploy/hetzner/monitor.py site
      - name: Check public API and MongoDB
        id: api
        continue-on-error: true
        run: python3 deploy/hetzner/monitor.py api
      - name: Check SSH host fingerprint is configured
        id: hostkey
        continue-on-error: true
        env:
          HETZNER_HOST_FINGERPRINT: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
        run: |
          if [ -z "$HETZNER_HOST_FINGERPRINT" ]; then
            echo "::error::L'empreinte SSH vérifiée du serveur est absente."
            exit 1
          fi
      - name: Check server disk space
        id: disk
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          fingerprint: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 1m
          script: python3 /opt/sirius/deploy/hetzner/monitor.py disk
      - name: Check server backups
        id: backup
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          fingerprint: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 1m
          script: python3 /opt/sirius/deploy/hetzner/monitor.py backup
      - name: Update alerts
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          SITE_OUTCOME: ${{ steps.site.outcome }}
          API_OUTCOME: ${{ steps.api.outcome }}
          DISK_OUTCOME: ${{ steps.disk.outcome }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          HOSTKEY_OUTCOME: ${{ steps.hostkey.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          DEPLOYMENT_STATUS: ${{ steps.deployment.outputs.outcome }}
          SIRIUS_SMS_ENABLED: ${{ vars.SIRIUS_SMS_ENABLED }}
          SIRIUS_SMS_ACCOUNT_SID: ${{ secrets.SIRIUS_SMS_ACCOUNT_SID }}
          SIRIUS_SMS_AUTH_TOKEN: ${{ secrets.SIRIUS_SMS_AUTH_TOKEN }}
          SIRIUS_SMS_FROM: ${{ secrets.SIRIUS_SMS_FROM }}
          SIRIUS_SMS_TO: ${{ secrets.SIRIUS_SMS_TO }}
          SIRIUS_SMS_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_sms }}
        with:
          script: |
            const monitor = require('./deploy/hetzner/monitor-issues.cjs');
            const sms = require('./deploy/hetzner/monitor-sms.cjs');
            const state = await monitor.reconcile(github, context, {
              site: process.env.SITE_OUTCOME,
              api: process.env.API_OUTCOME,
              disk: process.env.DISK_OUTCOME,
              backup: process.env.BACKUP_OUTCOME,
              hostkey: process.env.HOSTKEY_OUTCOME,
              deployment: process.env.DEPLOYMENT_STATUS === 'pending'
                ? 'pending' : process.env.DEPLOYMENT_OUTCOME,
            });
            await sms.handleSms(github, context, state.activeAlerts, state.openIssues, process.env, {
              test: process.env.SIRIUS_SMS_TEST === 'true',
            });
      - name: Report backup warning
        if: ${{ !cancelled() && steps.backup.outcome != 'success' }}
        run: echo "::warning::Sauvegarde en échec ou invérifiable ; consulter l'issue de surveillance."
      - name: Report SSH identity warning
        if: ${{ !cancelled() && steps.hostkey.outcome != 'success' }}
        run: echo "::warning::Identité SSH non vérifiée ; consulter l'issue de surveillance."
      - name: Report deployment warning
        if: ${{ !cancelled() && steps.deployment.outcome != 'success' }}
        run: echo "::warning::Déploiement en échec ou invérifiable ; consulter l'issue de surveillance."
      - name: Fail when an availability check failed
        if: ${{ !cancelled() && (steps.site.outcome != 'success' || steps.api.outcome != 'success' || steps.disk.outcome != 'success') }}
        run: exit 1
